<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>আমার নিজস্ব ভিডিও স্ট্রিমিং ও শেয়ারিং প্ল্যাটফর্ম</title>
    <!-- Firebase App (Modular SDK) -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getFirestore, collection, addDoc, getDocs, doc, getDoc, deleteDoc } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        // আপনার ফায়ারবেজ কনফিগারেশন
        const firebaseConfig = {
          apiKey: "AIzaSyAU_4yo0C_MLc4DCzWcCKof9e6maJU01SQ",
          authDomain: "video-sharing-app-4a882.firebaseapp.com",
          projectId: "video-sharing-app-4a882",
          storageBucket: "video-sharing-app-4a882.firebasestorage.app",
          messagingSenderId: "997374332635",
          appId: "1:997374332635:web:bd3d1988b64c6d3a6346fe",
          measurementId: "O-DSMLWYMMFL"
        };

        // ফায়ারবেজ ইনিশিয়ালাইজেশন
        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        window.firebaseDb = { db, collection, addDoc, getDocs, doc, getDoc, deleteDoc };
    </script>

    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #0f172a;
            color: #f8fafc;
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }
        .container {
            background-color: #1e293b;
            padding: 25px;
            border-radius: 12px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.5);
            width: 100%;
            max-width: 450px;
            text-align: center;
        }
        h2 {
            margin-bottom: 15px;
            font-size: 22px;
            color: #38bdf8;
        }
        p {
            font-size: 14px;
            color: #94a3b8;
            margin-bottom: 20px;
        }
        input[type="file"] {
            display: none;
        }
        .custom-file-upload {
            border: 2px dashed #38bdf8;
            display: inline-block;
            padding: 12px 20px;
            cursor: pointer;
            border-radius: 8px;
            background-color: #0f172a;
            color: #38bdf8;
            font-weight: bold;
            margin-bottom: 15px;
            transition: 0.3s;
            width: 100%;
            box-sizing: border-box;
        }
        .custom-file-upload:hover {
            background-color: #38bdf8;
            color: #0f172a;
        }
        video {
            width: 100%;
            border-radius: 8px;
            margin-top: 15px;
            background: #000;
        }
        .link-box {
            margin-top: 15px;
            display: none;
            text-align: left;
        }
        input[type="text"] {
            width: calc(100% - 70px);
            padding: 8px;
            border-radius: 4px;
            border: 1px solid #475569;
            background: #0f172a;
            color: #fff;
            font-size: 12px;
        }
        button.copy-btn {
            padding: 8px 12px;
            background-color: #10b981;
            border: none;
            color: white;
            border-radius: 4px;
            cursor: pointer;
            font-weight: bold;
        }
        button.copy-btn:hover {
            background-color: #059669;
        }
        .error-msg {
            color: #ef4444;
            font-size: 13px;
            margin-top: 10px;
        }
        .video-list {
            margin-top: 25px;
            text-align: left;
            border-top: 1px solid #334155;
            padding-top: 15px;
        }
        .video-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: #0f172a;
            padding: 8px 12px;
            border-radius: 6px;
            margin-bottom: 8px;
            font-size: 13px;
        }
        .delete-btn {
            background-color: #ef4444;
            color: white;
            border: none;
            padding: 5px 8px;
            border-radius: 4px;
            cursor: pointer;
            font-size: 11px;
        }
        .delete-btn:hover {
            background-color: #dc2626;
        }
        .loading {
            color: #38bdf8;
            font-size: 13px;
            margin-top: 10px;
            display: none;
        }
    </style>
</head>
<body>

<div class="container">
    <h2>আমার ভিডিও শেয়ারিং প্ল্যাটফর্ম</h2>
    <p>আপনার ডিভাইস থেকে ভিডিও ফাইল সিলেক্ট করুন:</p>

    <label class="custom-file-upload">
        <input type="file" id="videoInput" accept="video/*" onchange="handleVideoUpload(event)">
        📁 ডিভাইস থেকে ভিডিও চয়ন করুন
    </label>

    <div id="loadingMsg" class="loading">ভিডিও প্রসেস করা হচ্ছে, দয়া করে অপেক্ষা করুন...</div>
    <div id="errorMsg" class="error-msg"></div>

    <!-- ভিডিও প্লেয়ার -->
    <video id="videoPlayer" controls style="display:none;"></video>

    <!-- শেয়ারেবল লিংক বক্স -->
    <div class="link-box" id="linkBox">
        <p style="margin-bottom: 5px; font-size: 12px;">শেয়ার করার লিংক:</p>
        <div style="display: flex; gap: 5px;">
            <input type="text" id="shareLink" readonly>
            <button class="copy-btn" onclick="copyLink()">কপি</button>
        </div>
    </div>

    <!-- সংরক্ষিত ভিডিও তালিকা ও ডিলিট অপশন -->
    <div class="video-list">
        <p style="font-weight: bold; margin-bottom: 10px; color: #38bdf8;">সংরক্ষিত ভিডিওসমূহ:</p>
        <div id="savedVideosContainer">লোড হচ্ছে...</div>
    </div>
</div>

<script>
    window.addEventListener('DOMContentLoaded', () => {
        const checkFirebaseReady = setInterval(() => {
            if (window.firebaseDb) {
                clearInterval(checkFirebaseReady);
                loadVideoList();
                checkUrlParam();
            }
        }, 500);
    });

    async function handleVideoUpload(event) {
        const file = event.target.files[0];
        const errorMsg = document.getElementById('errorMsg');
        const loadingMsg = document.getElementById('loadingMsg');
        errorMsg.innerText = "";

        if (!file) return;

        loadingMsg.style.display = 'block';

        try {
            // ফাইলটিকে লোকাল ব্রাউজার ইউআরএলে রূপান্তর করা (ফ্রি ও ইনস্ট্যান্ট)
            const videoObjectURL = URL.createObjectURL(file);

            const { db, collection, addDoc } = window.firebaseDb;

            // ফায়ারস্টোর ডেটাবেজে ভিডিওর নাম ও লোকাল লিংক সংরক্ষণ
            const docRef = await addDoc(collection(db, "videos"), {
                name: file.name,
                url: videoObjectURL,
                createdAt: Date.now()
            });

            loadingMsg.style.display = 'none';
            playVideo(videoObjectURL, docRef.id);
            loadVideoList();

        } catch (err) {
            loadingMsg.style.display = 'none';
            errorMsg.innerText = "ত্রুটি: ভিডিও প্রসেস করা সম্ভব হয়নি। আবার চেষ্টা করুন।";
            console.error(err);
        }
    }

    async function loadVideoList() {
        const container = document.getElementById('savedVideosContainer');
        if (!window.firebaseDb) return;

        try {
            const { db, collection, getDocs } = window.firebaseDb;
            const querySnapshot = await getDocs(collection(db, "videos"));
            container.innerHTML = "";

            if (querySnapshot.empty) {
                container.innerHTML = "<p style='font-size: 12px; color: #64748b;'>কোনো ভিডিও সংরক্ষিত নেই।</p>";
                return;
            }

            querySnapshot.forEach((docSnap) => {
                const vid = docSnap.data();
                const id = docSnap.id;

                const item = document.createElement('div');
                item.className = 'video-item';
                item.innerHTML = `
                    <span style="overflow: hidden; text-overflow: ellipsis; white-space: nowrap; max-width: 200px;" title="${vid.name}">${vid.name}</span>
                    <div>
                        <button onclick="playSpecific('${vid.url}')" style="background:#38bdf8; border:none; padding:5px 8px; border-radius:4px; cursor:pointer; font-weight:bold; margin-right:4px;">চালান</button>
                        <button class="delete-btn" onclick="deleteVideo('${id}')">ডিলিট</button>
                    </div>
                `;
                container.appendChild(item);
            });
        } catch (err) {
            container.innerHTML = "<p style='font-size: 12px; color: #ef4444;'>তালিকা লোড করতে সমস্যা হয়েছে।</p>";
        }
    }

    function playVideo(url, id) {
        const player = document.getElementById('videoPlayer');
        const linkBox = document.getElementById('linkBox');
        const shareLink = document.getElementById('shareLink');

        player.src = url;
        player.style.display = 'block';
        player.play();

        const currentUrl = window.location.origin + window.location.pathname + '?v=' + id;
        shareLink.value = currentUrl;
        linkBox.style.display = 'block';
    }

    async function playSpecific(url) {
        playVideo(url, 'direct');
    }

    async function deleteVideo(id) {
        if (!confirm('আপনি কি নিশ্চিতভাবে ভিডিওটি ডিলিট করতে চান?')) return;

        try {
            const { db, doc, deleteDoc } = window.firebaseDb;
            await deleteDoc(doc(db, "videos", id));
            loadVideoList();
            
            document.getElementById('videoPlayer').style.display = 'none';
            document.getElementById('linkBox').style.display = 'none';
        } catch (err) {
            alert('ডিলিট করতে সমস্যা হয়েছে!');
        }
    }

    async function checkUrlParam() {
        const urlParams = new URLSearchParams(window.location.search);
        const vidId = urlParams.get('v');
        if (vidId && window.firebaseDb) {
            try {
                const { db, doc, getDoc } = window.firebaseDb;
                const docSnap = await getDoc(doc(db, "videos", vidId));
                if (docSnap.exists()) {
                    playVideo(docSnap.data().url, docSnap.id);
                }
            } catch (err) {
                console.error(err);
            }
        }
    }

    function copyLink() {
        const copyText = document.getElementById("shareLink");
        copyText.select();
        navigator.clipboard.writeText(copyText.value);
        alert("লিংকটি সফলভাবে কপি হয়েছে!");
    }
</script>

</body>
</html>
