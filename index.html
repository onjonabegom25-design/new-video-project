<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>আমার ভিডিও লাইভ সিস্টেম</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #0f172a;
            color: #f8fafc;
            text-align: center;
            padding: 30px;
        }
        .card {
            max-width: 600px;
            margin: 0 auto;
            background: #1e293b;
            padding: 25px;
            border-radius: 12px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.5);
        }
        input[type="file"] {
            margin: 15px 0;
            padding: 12px;
            background: #334155;
            color: white;
            border: 1px solid #475569;
            border-radius: 6px;
            width: 100%;
            cursor: pointer;
        }
        .link-box {
            margin-top: 20px;
            display: none;
            gap: 10px;
            align-items: center;
        }
        input[type="text"] {
            flex: 1;
            padding: 10px;
            background: #0f172a;
            border: 1px solid #475569;
            color: #38bdf8;
            border-radius: 6px;
            font-size: 14px;
        }
        button {
            padding: 10px 18px;
            background: #38bdf8;
            color: #0f172a;
            border: none;
            border-radius: 6px;
            font-weight: bold;
            cursor: pointer;
        }
        button:hover {
            background: #0ea5e9;
        }
        video {
            width: 100%;
            max-height: 400px;
            border-radius: 8px;
            margin-top: 20px;
            background: black;
        }
        .status {
            margin-top: 15px;
            font-size: 14px;
            color: #cbd5e1;
        }
    </style>
</head>
<body>

<div class="card">
    <h2>আমার নিজস্ব ভিডিও লাইভ প্লেয়ার</h2>
    <p>আপনার ৫-১০ এমবির ভিডিও সিলেক্ট করুন:</p>
    
    <!-- ভিডিও ফাইল সিলেক্ট করার ইনপুট -->
    <input type="file" id="videoInput" accept="video/mp4">
    
    <!-- জেনারেটেড লিংক ও কপি বাটন -->
    <div class="link-box" id="linkBox">
        <input type="text" id="shareLink" readonly>
        <button onclick="copyLink()">কপি লিংক</button>
    </div>

    <div class="status" id="statusText"></div>

    <!-- ভিডিও প্লেয়ার (অটো লাইভ লুপ মোড) -->
    <video id="videoPlayer" controls autoplay loop muted></video>
</div>

<script>
    const videoInput = document.getElementById('videoInput');
    const videoPlayer = document.getElementById('videoPlayer');
    const linkBox = document.getElementById('linkBox');
    const shareLink = document.getElementById('shareLink');
    const statusText = document.getElementById('statusText');

    // পেজ লোড হওয়ার সময় চেক করা লিংকে কোনো ভিডিওর কোড বা ফাইল আছে কি না
    window.onload = function() {
        const urlParams = new URLSearchParams(window.location.search);
        const videoId = urlParams.get('v');
        if (videoId) {
            const savedVideo = localStorage.getItem(videoId);
            if (savedVideo) {
                videoPlayer.src = savedVideo;
                videoPlayer.play();
                statusText.innerText = "লাইভ ভিডিও স্ট্রিম চলছে...";
            } else {
                statusText.innerText = "দুঃখিত, ভিডিওটি এই ব্রাউজারে পাওয়া যায়নি।";
            }
        }
    }

    // যখনই নতুন ভিডিও সিলেক্ট করা হবে
    videoInput.addEventListener('change', function(event) {
        const file = event.target.files[0];
        if (file) {
            const reader = new FileReader();
            statusText.innerText = "ভিডিও প্রসেস করা হচ্ছে...";
            
            reader.onload = function(e) {
                const base64Data = e.target.result;
                const videoId = 'video_' + Date.now();
                
                try {
                    // ব্রাউজারের লোকাল স্টোরেজে ভিডিও ডাটা সেভ করা
                    localStorage.setItem(videoId, base64Data);
                    
                    // ওয়েবসাইটের নিজস্ব ডোমেইন বা লিংক দিয়ে ইউনিক লিংক তৈরি করা
                    const currentUrl = window.location.origin + window.location.pathname;
                    const fullLink = currentUrl + '?v=' + videoId;
                    
                    // লিংকের বক্সে লিংক বসানো
                    shareLink.value = fullLink;
                    linkBox.style.display = "flex";
                    
                    // প্লেয়ারে ভিডিও চালু করা
                    videoPlayer.src = base64Data;
                    videoPlayer.play();
                    
                    statusText.innerText = "লিংক তৈরি সফল হয়েছে! নিচে কপি বাটনে ক্লিক করুন।";
                } catch (error) {
                    statusText.innerText = "ত্রুটি: ফাইলটি হয়তো খুব বড় বা মেমোরি ফুল।";
                }
            };
            
            reader.readAsDataURL(file);
        }
    });

    // লিংক কপি করার ফাংশন
    function copyLink() {
        shareLink.select();
        shareLink.setSelectionRange(0, 99999);
        navigator.clipboard.writeText(shareLink.value);
        alert("লিংক সফলভাবে কপি হয়েছে! এখন ক্রোম ব্রাউজারে নতুন ট্যাবে পেস্ট করতে পারেন।");
    }
</script>

</body>
</html>
