<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>আমার নিজস্ব ভিডিও স্ট্রিমিং ও শেয়ারিং প্ল্যাটফর্ম</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #0f172a;
            color: #f8fafc;
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }
        .container {
            background-color: #1e293b;
            padding: 25px;
            border-radius: 12px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.5);
            width: 100%;
            max-width: 450px;
            text-align: center;
        }
        h2 {
            margin-bottom: 15px;
            font-size: 22px;
            color: #38bdf8;
        }
        p {
            font-size: 14px;
            color: #94a3b8;
            margin-bottom: 20px;
        }
        input[type="file"] {
            display: none;
        }
        .custom-file-upload {
            border: 2px dashed #38bdf8;
            display: inline-block;
            padding: 10px 20px;
            cursor: pointer;
            border-radius: 8px;
            background-color: #0f172a;
            color: #38bdf8;
            font-weight: bold;
            margin-bottom: 15px;
            transition: 0.3s;
        }
        .custom-file-upload:hover {
            background-color: #38bdf8;
            color: #0f172a;
        }
        video {
            width: 100%;
            border-radius: 8px;
            margin-top: 15px;
            background: #000;
        }
        .link-box {
            margin-top: 15px;
            display: none;
            text-align: left;
        }
        input[type="text"] {
            width: calc(100% - 70px);
            padding: 8px;
            border-radius: 4px;
            border: 1px solid #475569;
            background: #0f172a;
            color: #fff;
            font-size: 12px;
        }
        button.copy-btn {
            padding: 8px 12px;
            background-color: #10b981;
            border: none;
            color: white;
            border-radius: 4px;
            cursor: pointer;
            font-weight: bold;
        }
        button.copy-btn:hover {
            background-color: #059669;
        }
        .error-msg {
            color: #ef4444;
            font-size: 13px;
            margin-top: 10px;
        }
        .video-list {
            margin-top: 25px;
            text-align: left;
            border-top: 1px solid #334155;
            padding-top: 15px;
        }
        .video-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: #0f172a;
            padding: 8px 12px;
            border-radius: 6px;
            margin-bottom: 8px;
            font-size: 13px;
        }
        .delete-btn {
            background-color: #ef4444;
            color: white;
            border: none;
            padding: 5px 8px;
            border-radius: 4px;
            cursor: pointer;
            font-size: 11px;
        }
        .delete-btn:hover {
            background-color: #dc2626;
        }
    </style>
</head>
<body>

<div class="container">
    <h2>আমার ভিডিও শেয়ারিং প্ল্যাটফর্ম</h2>
    <p>৫-১০ এমবির ভিডিও সিলেক্ট করুন ও আলাদা লিংক তৈরি করুন:</p>

    <label class="custom-file-upload">
        <input type="file" id="videoInput" accept="video/*" onchange="handleVideoUpload(event)">
        📁 ভিডিও চয়ন করুন
    </label>

    <div id="errorMsg" class="error-msg"></div>

    <!-- ভিডিও প্লেয়ার -->
    <video id="videoPlayer" controls style="display:none;"></video>

    <!-- শেয়ারেবল লিংক বক্স -->
    <div class="link-box" id="linkBox">
        <p style="margin-bottom: 5px; font-size: 12px;">শেয়ার করার লিংক:</p>
        <div style="display: flex; gap: 5px;">
            <input type="text" id="shareLink" readonly>
            <button class="copy-btn" onclick="copyLink()">কপি</button>
        </div>
    </div>

    <!-- সংরক্ষিত ভিডিও তালিকা ও ডিলিট অপশন -->
    <div class="video-list">
        <p style="font-weight: bold; margin-bottom: 10px; color: #38bdf8;">সংরক্ষিত ভিডিওসমূহ:</p>
        <div id="savedVideosContainer"></div>
    </div>
</div>

<script>
    const STORAGE_KEY = 'my_saved_videos_v1';

    window.onload = function() {
        loadVideoList();
        checkUrlParam();
    };

    function handleVideoUpload(event) {
        const file = event.target.files[0];
        const errorMsg = document.getElementById('errorMsg');
        errorMsg.innerText = "";

        if (!file) return;

        // সাইজ চেক (প্রায় ১০ এমবি লিমিট)
        if (file.size > 12 * 1024 * 1024) {
            errorMsg.innerText = "ত্রুটি: ফাইলটি খুব বড়! দয়া করে ১০ এমবির কম সাইজের ভিডিও দিন।";
            return;
        }

        const reader = new FileReader();
        reader.onload = function(e) {
            const base64Data = e.target.result;
            const videoId = 'vid_' + Date.now();

            let videos = getStoredVideos();
            
            // লোকাল স্টোরেজ ওভারফ্লো হ্যান্ডেল করা
            try {
                videos.push({ id: videoId, data: base64Data, name: file.name });
                localStorage.setItem(STORAGE_KEY, JSON.stringify(videos));
                
                playVideo(base64Data, videoId);
                loadVideoList();
            } catch (err) {
                errorMsg.innerText = "ত্রুটি: ব্রাউজারের মেমোরি ফুল! আগের কিছু ভিডিও ডিলিট করে নিন।";
            }
        };
        reader.readAsDataURL(file);
    }

    function getStoredVideos() {
        let data = localStorage.getItem(STORAGE_KEY);
        return data ? JSON.parse(data) : [];
    }

    function playVideo(data, id) {
        const player = document.getElementById('videoPlayer');
        const linkBox = document.getElementById('linkBox');
        const shareLink = document.getElementById('shareLink');

        player.src = data;
        player.style.display = 'block';
        player.play();

        const currentUrl = window.location.origin + window.location.pathname + '?v=' + id;
        shareLink.value = currentUrl;
        linkBox.style.display = 'block';
    }

    function loadVideoList() {
        const container = document.getElementById('savedVideosContainer');
        const videos = getStoredVideos();
        container.innerHTML = "";

        if (videos.length === 0) {
            container.innerHTML = "<p style='font-size: 12px; color: #64748b;'>কোনো ভিডিও সংরক্ষিত নেই।</p>";
            return;
        }

        videos.forEach(vid => {
            const item = document.createElement('div');
            item.className = 'video-item';
            item.innerHTML = `
                <span style="overflow: hidden; text-overflow: ellipsis; white-space: nowrap; max-width: 240px;" title="${vid.name}">${vid.name}</span>
                <div>
                    <button onclick="playSpecific('${vid.id}')" style="background:#38bdf8; border:none; padding:5px 8px; border-radius:4px; cursor:pointer; font-weight:bold; margin-right:4px;">চালান</button>
                    <button class="delete-btn" onclick="deleteVideo('${vid.id}')">ডিলিট</button>
                </div>
            `;
            container.appendChild(item);
        });
    }

    function playSpecific(id) {
        const videos = getStoredVideos();
        const found = videos.find(v => v.id === id);
        if (found) {
            playVideo(found.data, found.id);
        }
    }

    function deleteVideo(id) {
        let videos = getStoredVideos();
        videos = videos.filter(v => v.id !== id);
        localStorage.setItem(STORAGE_KEY, JSON.stringify(videos));
        loadVideoList();
        
        // যদি চলমান ভিডিওটি ডিলিট হয় প্লেয়ার ক্লিয়ার করা
        document.getElementById('videoPlayer').style.display = 'none';
        document.getElementById('linkBox').style.display = 'none';
    }

    function checkUrlParam() {
        const urlParams = new URLSearchParams(window.location.search);
        const vidId = urlParams.get('v');
        if (vidId) {
            playSpecific(vidId);
        }
    }

    function copyLink() {
        const copyText = document.getElementById("shareLink");
        copyText.select();
        navigator.clipboard.writeText(copyText.value);
        alert("লিংকটি সফলভাবে কপি হয়েছে!");
    }
</script>

</body>
</html>
